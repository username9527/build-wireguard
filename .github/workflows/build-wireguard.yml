name: Cross-Compile WireGuard for ARM32 Soft-Float (armv7l/armv5)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install ARM Soft-Float Toolchain & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-arm-linux-gnueabi \
            g++-arm-linux-gnueabi \
            make \
            git \
            libmnl-dev

      - name: Build wireguard-tools (wg) statically
        run: |
          git clone https://git.zx2c4.com/wireguard-tools
          cd wireguard-tools/src
          
          # 1. RUNSTATEDIR=/var/run 解决 Unix Socket 路径缺失问题
          # 2. EXTRA_CFLAGS 追加静态参数与 UAPI 缺失的头文件
          make -j$(nproc) \
            CC=arm-linux-gnueabi-gcc \
            LD=arm-linux-gnueabi-ld \
            RUNSTATEDIR=/var/run \
            EXTRA_CFLAGS="-O2 -static -I../contrib/uapi/kernel-headers" \
            LDFLAGS="-static" \
            wg
            
          # 验证二进制架构与静态链接状态
          file wg
          cd ../..

      - name: Build wireguard-go statically
        run: |
          git clone https://git.zx2c4.com/wireguard-go
          cd wireguard-go
          
          # 关键点：GOARM=5 强制生成纯 Soft-Float 指令，解决光猫上的 Illegal instruction 问题
          export GOOS=linux
          export GOARCH=arm
          export GOARM=5
          export CGO_ENABLED=0
          
          go build -v -ldflags="-s -w -extldflags '-static'" -o wireguard-go
          
          # 验证二进制架构与静态链接状态
          file wireguard-go
          cd ..

      - name: Collect & Package Artifacts
        run: |
          mkdir -p output
          cp wireguard-tools/src/wg output/
          cp wireguard-go/wireguard-go output/
          cd output
          tar -czvf wireguard-armv7l-softfp-static.tar.gz wg wireguard-go

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wireguard-armv7l-softfp-static
          path: output/wireguard-armv7l-softfp-static.tar.gz
